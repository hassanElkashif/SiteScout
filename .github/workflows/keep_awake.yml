name: Keep SiteScout Awake

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Visit and wake app
        run: |
          python - << 'EOF'
          import re
          import sys
          from playwright.sync_api import sync_playwright

          URL = "https://sitescout.streamlit.app/"

          def find_in_frames(page, selector, text_pattern=None):
              for frame in page.frames:
                  try:
                      loc = frame.locator(selector, has_text=text_pattern) if text_pattern else frame.locator(selector)
                      if loc.count() > 0:
                          return loc.first
                  except Exception:
                      continue
              return None

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(URL, wait_until="domcontentloaded", timeout=60000)

              woke = False
              for _ in range(15):
                  wake_btn = find_in_frames(page, "button", re.compile(r"get this app back up|wake", re.I))
                  if wake_btn:
                      wake_btn.click(force=True)
                      print("Clicked wake-up button inside iframe.")
                      woke = True
                      break
                  if find_in_frames(page, "[data-testid='stAppViewContainer']"):
                      break
                  page.wait_for_timeout(1500)

              loaded = False
              max_polls = 45 if woke else 15
              for _ in range(max_polls):
                  if find_in_frames(page, "[data-testid='stAppViewContainer']"):
                      loaded = True
                      break
                  page.wait_for_timeout(2000)

              browser.close()

              if not loaded:
                  print("ERROR: App did not finish waking up within timeout.")
                  sys.exit(1)

              print("SUCCESS: SiteScout is awake and WebSocket session is active.")
          EOF