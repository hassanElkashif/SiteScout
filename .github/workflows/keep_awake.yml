name: Keep SiteScout Awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Visit and wake app
        run: |
          python - << 'EOF'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto("https://sitescout.streamlit.app/", wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(8000)
              wake_btn = page.get_by_role("button", name="Yes, get this app back up!")
              if wake_btn.count() > 0:
                  wake_btn.first.click()
                  page.wait_for_timeout(45000)
                  print("Clicked wake-up button.")
              else:
                  print("App is already awake.")
              browser.close()
          EOF